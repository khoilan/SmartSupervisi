document.addEventListener('input',e=>{if(e.target.id==='teacher-login-name'){updateLoginSuggestions();return}if(e.target.id==='teacher-search'){query=e.target.value;page=1;database();$('#teacher-search').focus()}else if(e.target.id==='question-search')renderQuestions();else if(e.target.id==='global-search'){query=e.target.value;page=1;if(query)navigate(1)}else if(e.target.id==='f-observer'&&$('#sign-observer'))$('#sign-observer').textContent=e.target.value;else if(e.target.id==='f-date'&&$('#sign-date'))$('#sign-date').textContent='Tanggal: '+e.target.value});
document.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='login-form'){let chosen=selectedLoginTeacher||teachers().find(t=>t.name.toLowerCase()===$('#teacher-login-name').value.trim().toLowerCase())?.id;if(window.loginRole==='Guru'&&!chosen){$('#login-error').textContent='Nama Guru tidak ditemukan. Pilih nama dari daftar yang cocok.';return}role=window.loginRole||'Kepala Sekolah';currentTeacher=chosen||currentTeacher;enterApp();return}let form=e.target,button=form.querySelector('[type=submit]');button.disabled=true;button.textContent='Menyimpan…';try{
if(form.id==='teacher-form'){let v=Object.fromEntries(new FormData(form)),id=form.dataset.id||`G${Date.now()}`,teacher={id,...v,years:Number(v.years),active:v.active==='Ya'};let existing=stored.find(r=>r.record_type==='teacher'&&r.teacher_id===id);if(await save(rec('teacher',id,v.name,v.active,teacher),existing)){closeModal();render()}}
else if(form.id==='pre-form'){let v=Object.fromEntries(new FormData(form)),id=currentTeacher,old=stored.find(r=>r.record_type==='pre'&&r.teacher_id===id&&r.period===period);if(await save(rec('pre',id,'Pra-observasi','Tersimpan',v),old))render()}
else if(form.id==='instrument-form'){let scores=[...document.querySelectorAll('.score')].map(x=>Number(x.value)),evidence=scores.map((_,i)=>$('#evidence-'+i).value.trim()),notes=scores.map((_,i)=>$('#note-'+i).value.trim());if(scores.some(x=>!x)||evidence.some(x=>!x)){toast('Lengkapi 28 skor dan semua bukti nyata.');return}let v={teacher:currentTeacher,observer:$('#f-observer').value,date:$('#f-date').value,scores,evidence,notes},old=stored.find(r=>r.record_type==='observation'&&r.teacher_id===currentTeacher&&r.period===period);if(await save(rec('observation',currentTeacher,'Observasi Pembelajaran','Selesai',v,average(scores)),old))render()}
else if(form.id==='fact-form'){let v=Object.fromEntries(new FormData(form));if(await save(rec('fact',currentTeacher,'Catatan fakta','Tersimpan',v)))render()}
else if(form.id==='coaching-form'){let q=$('#chosen-question').value.trim(),response=$('#coaching-response').value.trim();if(!q||!response){toast('Lengkapi pertanyaan dan respons.');return}if(await save(rec('coaching',currentTeacher,q,'Tersimpan',{question:q,response})))render()}
else if(form.id==='follow-form'){let v=Object.fromEntries(new FormData(form)),id=$('#modal-teacher').value,old=stored.includes(window.editFollow)?window.editFollow:null;if(await save(rec('followup',id,v.title,v.status,v),old)){closeModal();render()}}
else if(form.id==='target-form'){let v={};['initial','goal','achieved'].forEach(key=>v[key]=competencies.map((_,i)=>Number($('#'+key+'-'+i).value)));if(Object.values(v).flat().some(n=>!n||n<1||n>4)){toast('Semua skor harus berada di antara 1 dan 4.');return}let old=stored.find(r=>r.record_type==='target'&&r.teacher_id===currentTeacher&&r.period===period);if(await save(rec('target',currentTeacher,'Target kompetensi','Tersimpan',v,average(v.achieved)),old))render()}
}finally{if(button.isConnected){button.disabled=false;button.textContent=button.dataset.original||'Simpan'}}});
async function importCSV(file){if(!file)return;let lines=(await file.text()).replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);function split(line){return [...line.matchAll(/(?:^|,)("(?:[^"]|"")*"|[^,]*)/g)].map(m=>m[1].replace(/^"|"$/g,'').replaceAll('""','"'))}let headers=split(lines.shift()).map(x=>x.toLowerCase()),required=['nip','name','gender','subject','class_name','employment','education','years','contact','active'];if(required.some(x=>!headers.includes(x))){toast('Header CSV tidak sesuai dengan hasil ekspor guru.');return}let count=0;for(const line of lines.slice(0,Math.max(0,999-stored.length))){let values=split(line),v=Object.fromEntries(headers.map((x,i)=>[x,values[i]||'']));if(!v.name||!v.nip)continue;let id=`G${Date.now()}${count}`,t={id,...v,years:Number(v.years)||0,active:v.active.toLowerCase()==='ya'};if(await save(rec('teacher',id,t.name,t.active?'Aktif':'Tidak aktif',t)))count++}toast(`${count} guru berhasil diimpor.`);render()}
$('#close-modal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
(async()=>{try{syncStatus('Menghubungkan Canva Sheet…',true);const result=await window.dataSdk.init({onDataChanged(data){stored=data;syncStatus('Tersinkron ke Canva Sheet',true);let settings=data.filter(r=>r.record_type==='settings').at(-1);if(settings&&periods.includes(parse(settings).period))period=parse(settings).period;render()}});ready=result.isOk;if(!ready){syncStatus('Canva Sheet tidak tersedia',false);toast('Canva Sheet belum tersedia; perubahan belum dapat disimpan.')}else syncStatus('Tersinkron ke Canva Sheet',true)}catch(e){syncStatus('Sinkronisasi gagal',false);toast('Canva Sheet belum tersedia; perubahan belum dapat disimpan.')}render()})();
</script>
